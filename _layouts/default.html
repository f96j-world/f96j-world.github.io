<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Filip Janev — Portfolio</title>
  <meta name="description" content="Creative Editor & Junior Media Buyer — I create, polish, and launch content that performs.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">

  <!-- Favicon -->
  <link rel="icon" href="/assets/favicon.png" sizes="any">
  <link rel="apple-touch-icon" href="/assets/favicon.png">

  <!-- Prevent flash: pre-apply saved or OS theme -->
  <script>
    (function(){
      try {
        var k='fj-theme', s=localStorage.getItem(k);
        if(s==='dark') document.documentElement.classList.add('theme-dark');
        if(!s){
          var d=window.matchMedia('(prefers-color-scheme: dark)').matches;
          if(d) document.documentElement.classList.add('theme-dark');
        }
      } catch(e){}
    })();
  </script>

  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-banner">
    <div class="site-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Portfolio</a>
      <nav class="nav">
        <a class="nav__link {% if page.url == '/' %}is-active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        <a class="nav__link {% if page.url contains '/cv' %}is-active{% endif %}" href="{{ '/cv' | relative_url }}">CV</a>
        <a class="nav__link {% if page.url contains '/upwork' %}is-active{% endif %}" href="{{ '/upwork' | relative_url }}">Upwork</a>
        <a class="nav__link {% if page.url contains '/contact' %}is-active{% endif %}" href="{{ '/contact' | relative_url }}">Contact</a>
      </nav>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme"><span class="theme-toggle__icon">☀️</span></button>
    </div>
  </header>

  <main class="page"><div class="site-inner">{{ content }}</div></main>

  <footer class="site-footer">
    <div class="site-inner">
      <small>© {{ "now" | date: "%Y" }} Filip Janev • Built with GitHub Pages</small>
    </div>
  </footer>

  <script src="/assets/site.js"></script>

  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</body>
</html>
